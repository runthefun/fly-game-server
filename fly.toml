# fly.toml app configuration file generated for awe-game-shared-server on 2025-01-13T12:51:24+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'awe-game-shared-server'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'on-failure'
  retries = 10

[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1
