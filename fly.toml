# fly.toml app configuration file generated for awe-game-shared-server on 2025-01-13T12:51:24+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wl--awe-game-shared-server'
primary_region = 'iad'

[build]

[http_service]
internal_port = 2567
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[restart]]
policy = 'on-failure'
retries = 10

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024
